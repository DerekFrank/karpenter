name: Feature
description: Suggest an idea for a new feature
labels: ['kind/feature']
body:
- type: markdown
  attributes:
    value: |
      > [!IMPORTANT]
      > Before filing, please review the [Feature Lifecycle](https://github.com/kubernetes-sigs/karpenter/blob/main/FEATURE_LIFECYCLE.md) to understand how feature requests are evaluated.
      >
      > The following categories are [out of scope](https://github.com/kubernetes-sigs/karpenter/blob/main/SCOPE.md) for this repository:
      > - Notification and alerting delivery (use external tooling that consumes Karpenter's events/metrics)
      > - Pod-level scheduling decisions (belongs to kube-scheduler)
      > - Exposing internal implementation details (users express *what*, not *how*)
      > - Provider-specific features (belong in the provider repo, e.g. [karpenter-provider-aws](https://github.com/aws/karpenter-provider-aws/issues/new/choose))
      > - Workload management (scaling pods/replicas belongs in HPA, KEDA, VPA, etc.)
- type: textarea
  attributes:
    label: Description
    description: Describe the problem you're trying to solve, not just the solution you have in mind.
    value: |
      **What problem are you trying to solve?**

      **How important is this feature to you?**

      * Please vote on this issue by adding a 👍 [reaction](https://blog.github.com/2016-03-10-add-reactions-to-pull-requests-issues-and-comments/) to the original issue to help the community and maintainers prioritize this request
      * Please do not leave "+1" or "me too" comments, they generate extra noise for issue followers and do not help prioritize the request
      * Comments asking for updates generate extra noise for issue followers and do not help maintainers prioritize issues. If you think the issue is higher priority than it is [labelled](https://github.com/kubernetes-sigs/karpenter/blob/main/FEATURE_LIFECYCLE.md#3-check-the-priority), please instead add your user story.
      * If you are interested in working on this issue or have submitted a pull request, please assign yourself
